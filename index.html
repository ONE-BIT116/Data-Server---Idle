<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=1280, initial-scale=0.3">
        <link rel="stylesheet" href="static/style.css">
        <title>Data Server - Idle</title>
    </head>
    <body>
        <div class="main">
            <div class="main-right">
                <div class="bulding-tab">
                    <div class="router">
                        <img src="router.png" alt="Router">
                        <h1 class="router-name">Router</h1>
                        <span class="router-colvo" id="colvo">0</span>
                        <span class="ro-cost" id="router-cost">15</span>
                        <button class="buy-btn" id="buy-button">Buy</button>
                    </div>
                </div>
            </div>
            <div class="main-left">
                <div class="image-server" id="click"><img src="server.gif" alt="Data-Server"></div>
                <div class="right-score">
                    <h1 class="right-total"><span id="bytes">Byte: </span><span id="total">0.0</span></h1>
                </div>
            </div>
        </div>
        <script src="static/script.js"></script>
    </body>
</html>
